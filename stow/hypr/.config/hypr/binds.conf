# See https://wiki.hypr.land/Configuring/Keywords/
$mod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more

###################
### MY PROGRAMS ###
###################
# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = foot
$fileManager = nautilus
$launcher = ~/.config/rofi/launchers/type-3/launcher.sh
$editor = nvim
$browser = helium-browser
$osd = swayosd
$noti = swaync-client -t


##################################
########### KEYBINDINGS ##########
##################################

#<========= Spawns Binds =========>
# General App
bind = $mod, Grave, exec, $terminal
bind = $mod, T, exec, kitty zsh
bind = $mod, E, exec, $fileManager
bind = $mod, Space, exec, $launcher
bind = $mod, B, exec, $browser --ozone-platform=x11
bind = $mod SHIFT CTRL, B, exec, $browser --incognito --ozone-platform=x11
bind = $mod ALT, D, exec, flatpak run com.discordapp.Discord
bind = $mod ALT, W, exec, flatpak run com.rtosta.zapzap
bind = $mod ALT, Z, exec, zed
bind = $mod, C, exec, code


# General App
bind = $mod SHIFT, E, exec, foot -e yazi
bind = $mod CTRL, E, exec, foot -e gdu
bind = $mod SHIFT, Backslash, exec, ghostty -e nvim
bind = $mod CTRL, W, exec, waypaper
bind = $mod CTRL, D, exec, nwg-displays
bind = $mod, A, exec, $noti
bind = $mod SHIFT, A, exec, notify-send 'Test' 'test'

#<========= Script Binds =========>
bind = $mod, XF86AudioPlay, exec, hyprctl notify 1 1000 "rgb(40a02b)" "Recording Screen" && sleep 1.01 && ~/.config/hypr/scripts/start-scr-rec.sh
bind = $mod, XF86AudioStop, exec, ~/.config/hypr/scripts/stop-scr-rec.sh && sleep 0.3 && hyprctl notify 1 3000 "rgb(40a02b)" "Recording Stopped"
bind = $mod CTRL, V, exec, ~/.config/hypr/scripts/ocr-snip.sh
bind = $mod SHIFT, S, exec, grimblast copysave output      #~/.config/hypr/scripts/ss.sh
bind = $mod SHIFT CTRL, S, exec, grimblast copysave active      #~/.config/hypr/scripts/ss.sh
bind = $mod SHIFT ALT, S, exec, grimblast copysave area      #~/.config/hypr/scripts/ss.sh
bind = $mod, M, exec, ~/.config/hypr/scripts/rofi-emoji.sh

#<========= Extra Binds =========>
bind = $mod ALT, C, exec, hyprpicker -a
bind = $mod , L, exec, hyprlock
bind = ALT, L, exec, hyprlock
bind = $mod, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mod, I, exec, ~/.config/hypr/scripts/greet.sh
bind = $mod, L, exec, foot -c "$(hyprctl layers)"

#<========= Window Binds =========>
# General
bind = $mod, F, exec, hyprctl dispatch fullscreen
bind = $mod, P, pseudo, # dwindle
bind = $mod, J, togglesplit, # dwindle
bind = $mod, W, togglefloating,
bind = ALT SHIFT, Q, killactive,
bind = ALT SHIFT CTRL, Q, exec, hyprctl kill & hyprctl notify 0 3000 "rgb(400011)" "Select a Window to KILL"
bind = $mod SHIFT, Q, killactive,
bind = $mod SHIFT CTRL, Q, exec, hyprctl kill & hyprctl notify 0 3000 "rgb(400011)" "Select a Window to KILL"

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $mod, Z, movewindow
bindm = $mod, X, resizewindow


#<========= HyprExpo Binds =========>
bind = ALT, Tab, hyprexpo:expo, toggle


#<========= Layout Binds =========>
bind = $mod, Bracketright, exec, hyprctl keyword general:layout dwindle & hyprctl notify 1 2000 "rgb(40a02b)" "Tiling Layout"
bind = $mod, Bracketleft, exec, hyprctl keyword general:layout scrolling & hyprctl notify 1 2000 "rgb(40a02b)" "Scrolling Layout"


#<========= HyprScrolling Binds =========>
bind = $mod, period, layoutmsg, move +col
bind = $mod, comma, layoutmsg, move -col
bind = $mod CTRL, period, layoutmsg, movewindowto r
bind = $mod CTRL, comma, layoutmsg, movewindowto l
bind = $mod CTRL, right, layoutmsg, swapcol r
bind = $mod CTRL, left, layoutmsg, swapcol l
bind = $mod SHIFT, up, layoutmsg, movewindowto u
bind = $mod SHIFT, down, layoutmsg, movewindowto d
bind = $mod, D, layoutmsg, colresize 1
bindd = SUPER SHIFT, F, Maximize App Window, fullscreen, 1
bind = $mod SHIFT, D, layoutmsg, promote
bind = $mod, R, layoutmsg, colresize +conf

bind = $mod , mouse_down, layoutmsg, move -col
bind = $mod , mouse_up, layoutmsg, move +col


#<========= System Binds =========>
bind = $mod, Insert, exec, zeditor ~/.config/hypr/hyprland.conf
bind = $mod+SHIFT, Numbersign, exec, ~/.config/hypr/scripts/rebar.sh
bind = $mod+SHIFT+CTRL, Numbersign, exec, zeditor ~/.config/hypr/waybar/config.jsonc
bind = $mod, Numbersign, exec, killall -SIGUSR1 waybar
bind = SHIFT CTRL, Escape, exec, alacritty -e btop

bind = $mod, Delete, exec, wlogout
bind = $mod SHIFT ALT CTRL, Delete, exit,

bind = $mod, Caps_lock, exec, ~/.config/hypr/scripts/litemode.sh

 # Power Profile Binds
bind = $mod, KP_Divide, exec, ~/.config/mango/tuned/perf.sh & hyprctl notify 1 2000 "rgb(F7768E)" "Performance Mode"
bind = $mod, KP_Multiply, exec, ~/.config/mango/tuned/bal.sh & hyprctl notify 1 2000 "rgb(AD8EE6)" "Balanced Mode"
bind = $mod, KP_Subtract, exec, ~/.config/mango/tuned/save.sh & hyprctl notify 1 2000 "rgb(9ECE6A)" "PowerSaving Mode"

binde = $mod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
binde = $mod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind = $mod CTRL ALT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mod CTRL ALT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')



#<========= Workspace Binds =========>
# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod CTRL SHIFT, up, movetoworkspace, -1
bind = $mod CTRL SHIFT, down, movetoworkspace, +1

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod CTRL, S, movetoworkspace, special:magic

#<========= Mouse Binds =========>
# Scroll through existing workspaces with mod + scroll
bind = $mod CTRL, mouse_up, exec, pypr-client change_workspace +1
bind = $mod CTRL, mouse_down, exec, pypr-client change_workspace -1
bind = $mod SHIFT, mouse_up, layoutmsg, swapcol r
bind = $mod SHIFT, mouse_down,  layoutmsg, swapcol l


#<========= Media Binds =========>
# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindel = $mod,XF86AudioRaiseVolume, exec,  volumectl -dub up
bindel = $mod,XF86AudioLowerVolume, exec,  volumectl -dub down
bindel = $mod,XF86AudioMute, exec,  volumectl -d toggle-mute
bindel = $mod,XF86MonBrightnessUp, exec,  lightctl -d up
bindel = $mod,XF86AudioMicMute, exec, volumectl -d toggle-mic-mute
bindel = $mod,XF86MonBrightnessDown, exec, lightctl -d down

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume=raise --max-volume=150
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume=lower --max-volume=150
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume=mute-toggle --max-volume=150
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume=mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness=+5
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness=-2
bindel = ,Caps_lock, exec, swayosd-client --caps-lock
bindel = ,Num_lock, exec, swayosd-client --num-lock
bindel = ,Scroll_lock, exec, swayosd-client --scroll-lock

# Requires playerctl
bindl = , XF86AudioNext, exec, swayosd-client --playerctl=next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl=play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl=play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl=prev


#<========= Pyprland Binds =========>
bind = $mod SHIFT,  Z, exec, pypr-client zoom
bind = $mod ALT,    P, exec, pypr-client toggle_dpms
bind = $mod SHIFT,  O, exec, pypr-client shift_monitors +1
bind = $mod,        Tab, exec, pypr-client expose
; bind = $mod CTRL,   down, exec, pypr-client change_workspace +1
; bind = $mod CTRL,   up, exec, pypr-client change_workspace -1
bind = $mod,        L, exec, pypr-client toggle_dpms
bind = $mod CTRL SHIFT, W, exec, pypr-client toggle wall
bind = $mod,        Backslash, exec, pypr-client toggle term
bind = $mod,        KP_Delete, exec, pypr-client toggle blueman
bind = $mod,        N, exec, pypr-client fetch_client_menu
bind = $mod SHIFT,   Insert, exec, pypr reload & hyprctl notify 0 3000 "rgb(400011)" "PYPRLAND RELOADED"
