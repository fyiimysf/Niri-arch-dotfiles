
#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }


}

binds {

    scroll_event_delay = 0
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, vertical, workspace
gesture = 3, pinch, dispatcher, togglespecialworkspace, magic
; gesture = 3, up, dispatcher, pypr-client change_workspace +1
; gesture = 3, down, dispatcher, pypr-client change_workspace +1
gesture = 3, right, dispatcher, layoutmsg, move -col
gesture = 3, left, dispatcher, layoutmsg, move +col
# gesture = 4, down, dispatcher, hyprexpo:expo, toggle
gesture = 4, vertical, dispatcher, togglespecialworkspace, magic
gesture = 4, left, dispatcher, movefocus, r
gesture = 4, right, dispatcher, movefocus, l
gesture = 4, pinch, dispatcher, hyprexpo:expo, toggle
gesture = 5, pinch, dispatcher, hyprexpo:expo, toggle
; gesture = 2, pinchout, mod: SUPER, dispatcher, exec hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
