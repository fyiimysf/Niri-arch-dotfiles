
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$


windowrule = float,class:^(Alacritty)$,title:^(Alacritty)$
# windowrule = colresize 1,class:helium
windowrule = float,move 1300 10,class:^(blueman-manager)$,border_size:0
windowrule = dimaround,bordersize 0,float,title:kitty-term
windowrule = bordersize 0,float,title:bluetuith
windowrule = bordersize 0,opacity 0.7,float,title:Waypaper
windowrule = bordersize 0,opacity 0.8,float,title:nwg-displays
# windowrule = bordersize 0,class:zed-editor
windowrule = pin,content video,opacity 1 override,float,move 1500 830,title:^(Picture in picture)$

layerrule = blur,rofi
; layerrule = blur,swaync-control-center
; layerrule = blur,swaync-notification-window
layerrule = dimaround,waybar

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
