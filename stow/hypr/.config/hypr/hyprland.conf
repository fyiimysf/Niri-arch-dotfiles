
#################
### AUTOSTART ###
#################
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = hyprpm reload -n
# exec-once = nm-applet & blueman-applet
# exec-once = hyprsunset -t 4000
# exec-once = pypr
# exec-once = swayosd-server
# exec-once = waybar -c ~/.config/hypr/waybar/config.jsonc -s '/home/jfifi/.config/hypr/waybar/style.css' &
exec-once = ~/.config/hypr/scripts/autostart.sh
exec-once = avizo-service

#################
### SOURCES ###
#################

### INPUT ###
source = ~/.config/hypr/input.conf

### PLUGINS ###
source = ~/.config/hypr/plugins.conf

### MONITORS ###
source = ~/.config/hypr/monitors.conf

### KEYBINDS ###
source = ~/.config/hypr/binds.conf

### WINDOW RULES ###
source = ~/.config/hypr/rules.conf

### LOOK & FEEL ###
source = ~/.config/hypr/look.conf

### PYPRLAND CONFIG ###
# ~/.config/hypr/pyprland.toml


# workspace = 1, monitor:eDP-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
# workspace = 4, monitor:eDP-1
# workspace = 5, monitor:eDP-1



#############################
### ENVIRONMENT VARIABLES ###
#############################
# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


env = LIBVA_DRIVER_NAME,nvidia
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

